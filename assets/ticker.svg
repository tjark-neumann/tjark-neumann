<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="46" viewBox="0 0 1200 46" role="img" aria-label="Ticker: data science, PyTorch, Jupyter, Python, Cloudflare, LaTeX">
  <defs>
    <style>
      .tick { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 5px; fill: #FF6F91; }
      .aqua { fill: #2FB5A6; }
      #reel { animation: scroll 22s linear infinite; }
      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1500px); } }
      @media (prefers-reduced-motion: reduce) { #reel { animation: none; } }
    </style>
  </defs>
  <g id="reel">
    <text class="tick" x="0"    y="29" textLength="1500" lengthAdjust="spacingAndGlyphs">DATA SCIENCE&#160;&#160;✦&#160;&#160;AI&#160;&#160;✦&#160;&#160;PYTORCH&#160;&#160;✦&#160;&#160;JUPYTER&#160;&#160;✦&#160;&#160;PYTHON&#160;&#160;✦&#160;&#160;CLOUDFLARE&#160;&#160;✦&#160;&#160;LATEX&#160;&#160;✦&#160;&#160;GOOD WAVES ONLY&#160;&#160;✦&#160;&#160;</text>
    <text class="tick" x="1500" y="29" textLength="1500" lengthAdjust="spacingAndGlyphs">DATA SCIENCE&#160;&#160;✦&#160;&#160;AI&#160;&#160;✦&#160;&#160;PYTORCH&#160;&#160;✦&#160;&#160;JUPYTER&#160;&#160;✦&#160;&#160;PYTHON&#160;&#160;✦&#160;&#160;CLOUDFLARE&#160;&#160;✦&#160;&#160;LATEX&#160;&#160;✦&#160;&#160;GOOD WAVES ONLY&#160;&#160;✦&#160;&#160;</text>
  </g>
</svg>
