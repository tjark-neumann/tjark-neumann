<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tjark Neumann">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f22"/>
      <stop offset="0.55" stop-color="#121734"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>

    <!-- shimmering name fill: a 300px-wide gradient that slides forever -->
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#4f7cff"/>
      <stop offset="0.30" stop-color="#38e1ff"/>
      <stop offset="0.50" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#ff5c7a"/>
      <stop offset="1"    stop-color="#4f7cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="loopGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="900" height="300" rx="20" fill="url(#bg)"/>

  <!-- ================= point cloud + edges (behind the text) ================= -->
  <g filter="url(#soft)" opacity="0.95">

    <!-- edges of the Vietoris–Rips-ish filtration: fade in and out -->
    <g stroke="#4f7cff" stroke-width="1.2">
      <line x1="120" y1="70"  x2="190" y2="120"><animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="0s"   repeatCount="indefinite"/></line>
      <line x1="190" y1="120" x2="150" y2="210"><animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="1.2s" repeatCount="indefinite"/></line>
      <line x1="700" y1="95"  x2="770" y2="150"><animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="0.6s" repeatCount="indefinite"/></line>
      <line x1="770" y1="150" x2="720" y2="225"><animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="2s"   repeatCount="indefinite"/></line>
      <line x1="650" y1="180" x2="720" y2="225"><animate attributeName="opacity" values="0;0.4;0"  dur="8s" begin="3s"   repeatCount="indefinite"/></line>
    </g>

    <!-- the persistent H1 loop: draws itself on, then breathes -->
    <circle cx="735" cy="160" r="58" fill="url(#loopGlow)"/>
    <circle cx="735" cy="160" r="58" fill="none" stroke="#ff5c7a" stroke-width="2.4"
            stroke-dasharray="365" stroke-dashoffset="365">
      <animate attributeName="stroke-dashoffset" values="365;0" dur="3s" begin="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="0.9;0.45;0.9" dur="4s" begin="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- left cluster (one component) -->
    <g fill="#4f7cff">
      <circle cx="120" cy="70"  r="5"><animate attributeName="cy" values="70;62;70"  dur="6s"  repeatCount="indefinite"/></circle>
      <circle cx="190" cy="120" r="6"><animate attributeName="cx" values="190;182;190" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="210" r="5"><animate attributeName="cy" values="210;220;210" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="95"  cy="150" r="4"><animate attributeName="cx" values="95;88;95"    dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="60"  r="3.5"><animate attributeName="cy" values="60;52;60"   dur="8s"  repeatCount="indefinite"/></circle>
    </g>

    <!-- right cluster (a second component) -->
    <g fill="#38e1ff">
      <circle cx="700" cy="95"  r="5.5"><animate attributeName="cy" values="95;86;95"   dur="6s"  repeatCount="indefinite"/></circle>
      <circle cx="770" cy="150" r="6"><animate attributeName="cx" values="770;780;770"  dur="7.5s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="225" r="5"><animate attributeName="cy" values="225;235;225"  dur="5s"  repeatCount="indefinite"/></circle>
      <circle cx="650" cy="180" r="4"><animate attributeName="cx" values="650;642;650"  dur="6.8s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="100" r="3.5"><animate attributeName="cy" values="100;92;100" dur="8.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- faint drifting noise -->
    <g fill="#8aa0ff" opacity="0.5">
      <circle cx="420" cy="55"  r="2.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="245" r="2.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="250" r="2"><animate attributeName="opacity"  values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- ================= name + tagline (on top) ================= -->
  <text x="450" y="158" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800"
        letter-spacing="2" fill="url(#shimmer)">TJARK NEUMANN</text>

  <text x="450" y="196" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="5"
        fill="#9fb0d8" opacity="0">
    data · code · the shape of things
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="1.4s" fill="freeze"/>
  </text>
</svg>
